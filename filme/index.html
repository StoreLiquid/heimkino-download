<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120b08">
<title>Filme auf der Platte</title>
<link rel="icon" type="image/png" href="symbole/icon-64.png">
<link rel="apple-touch-icon" href="symbole/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heimkino">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#120b08; --bg2:#22140d; --text:#fff3e6; --dim:#c4a58d; --glas:rgba(255,210,170,.08); --rand:rgba(255,210,170,.16);
  --akzent:#ffa24a; --ja:#ffbd4a; --teil:#ffbd4a; --nein:#7b839c; --radius:16px; --blur:22px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
/* EIN großes unscharfes Hintergrundbild, nicht pro Karte (Android-Tablet-tauglich) */
#hg{position:fixed;inset:-60px;z-index:-2;background:center/cover no-repeat;filter:blur(60px) saturate(1.3);opacity:.5;transition:opacity .6s,background-image .6s}
#hg2{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% 0%,transparent,var(--bg) 80%)}
.leicht #hg{display:none}
.leicht .glas,.leicht .blatt{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--bg2)!important}
.glas{background:var(--glas);border:1px solid var(--rand);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4)}
header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-width:0 0 1px}
.zeile{display:flex;gap:10px;align-items:center;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:10px;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
h1{font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:120px}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--dim);letter-spacing:0}
.reiter{display:flex;padding:3px;border-radius:999px;background:var(--glas);border:1px solid var(--rand)}
.reiter button{border:0;background:none;color:var(--dim);font:inherit;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer}
.reiter button[aria-selected=true]{background:var(--akzent);color:#fff}
.reiter button[aria-selected=true]{color:#1a0d05}
.suche{flex:1 1 220px;min-width:160px;border-radius:999px;padding:9px 16px;color:var(--text);font:inherit;outline:none}
.suche::placeholder{color:var(--dim)}
.suche:focus{border-color:var(--akzent)}
.filter{display:flex;gap:8px;overflow-x:auto;max-width:1400px;margin:10px auto 0;padding-bottom:2px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rand);background:var(--glas);color:var(--text);font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--akzent);border-color:var(--akzent);color:#fff}
.chip[aria-pressed=true]{color:#1a0d05}
select.chip{appearance:none;padding-right:14px}
main{max-width:1400px;margin:0 auto;padding:16px 16px 80px}
#info{color:var(--dim);font-size:14px;margin:4px 2px 14px}
#raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
@media(min-width:900px){#raster{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}}
.karte{position:relative;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;display:block;padding:0}
.bild{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--bg2);box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .25s}
.karte:hover .bild,.karte:focus-visible .bild{transform:translateY(-4px) scale(1.02)}
.karte:focus-visible{outline:2px solid var(--akzent);outline-offset:4px;border-radius:var(--radius)}
.bild img{width:100%;height:100%;object-fit:cover;display:block}
.platte{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(10,12,20,.78);color:#fff}
.platte i{width:9px;height:9px;border-radius:50%;background:var(--nein)}
.ja .platte i{background:var(--ja);box-shadow:0 0 8px var(--ja)}
.teil .platte i{background:var(--teil);box-shadow:0 0 8px var(--teil)}
.fsk{position:absolute;right:8px;top:8px;min-width:28px;text-align:center;font-size:12px;font-weight:800;padding:3px 7px;border-radius:8px;background:rgba(10,12,20,.78);color:#fff}
.titel{margin:8px 2px 0;font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jahr{margin:1px 2px 0;font-size:12px;color:var(--dim)}
.leer{text-align:center;color:var(--dim);padding:60px 0}
/* Detailblatt */
#decke{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none}
#decke.auf{display:block}
.blatt{position:fixed;z-index:21;left:50%;bottom:0;transform:translate(-50%,100%);width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);transition:transform .3s ease;border-bottom:0}
.blatt.auf{transform:translate(-50%,0)}
@media(min-width:700px){.blatt{bottom:50%;border-radius:24px;border-bottom:1px solid var(--rand);transform:translate(-50%,calc(50% + 40px));opacity:0;transition:transform .3s,opacity .3s;pointer-events:none}.blatt.auf{transform:translate(-50%,50%);opacity:1;pointer-events:auto}}
.blatt .kopf{display:flex;gap:16px}
.blatt img{width:130px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.blatt h2{font-size:22px;line-height:1.2;letter-spacing:-.01em}
.blatt .meta{color:var(--dim);margin-top:6px;font-size:14px}
.blatt .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.blatt .tags span{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--rand);background:var(--glas)}
.status{margin-top:18px;padding:14px 16px;border-radius:14px;display:flex;gap:12px;align-items:flex-start;background:var(--glas);border:1px solid var(--rand)}
.status i{flex:none;width:14px;height:14px;border-radius:50%;margin-top:4px;background:var(--nein)}
.status.ja i{background:var(--ja);box-shadow:0 0 10px var(--ja)}
.status.teil i{background:var(--teil);box-shadow:0 0 10px var(--teil)}
.status b{display:block}
.status span{font-size:14px;color:var(--dim)}
.zu{position:sticky;float:right;top:0;border:0;background:var(--glas);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;margin:-4px -4px 0 8px}
/* Hinweis „Zum Home-Bildschirm“ (nur beim ersten Besuch) */
#tipp{position:fixed;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translate(-50%,140%);width:min(440px,calc(100% - 24px));border-radius:22px;padding:16px 18px;transition:transform .4s ease}
#tipp.auf{transform:translate(-50%,0)}
#tipp .kopf{display:flex;gap:12px;align-items:center;margin-bottom:8px}
#tipp .kopf img{width:44px;height:44px;border-radius:11px}
#tipp h3{font-size:16px;line-height:1.2}
#tipp ol{margin:6px 0 12px 20px;font-size:14px;color:var(--dim)}
#tipp ol li{margin:3px 0}
#tipp ol b{color:var(--text)}
#tipp .knoepfe{display:flex;gap:8px;justify-content:flex-end}
#tipp button{border:1px solid var(--rand);background:var(--glas);color:var(--text);font:inherit;font-size:14px;padding:7px 16px;border-radius:999px;cursor:pointer}
#tipp button.haupt{background:var(--akzent);border-color:var(--akzent);color:#fff}
footer{position:fixed;left:0;right:0;bottom:0;z-index:5;text-align:center;font-size:12px;color:var(--dim);padding:8px 16px calc(env(safe-area-inset-bottom) + 8px);pointer-events:none}
footer button{pointer-events:auto;border:0;background:none;color:var(--dim);font:inherit;text-decoration:underline;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="hg"></div><div id="hg2"></div>
<header class="glas">
  <div class="zeile">
    <img class="logo" src="symbole/logo-96.png" alt="" width="40" height="40">
    <h1>Filme &amp; Serien <small id="stand">auf der 10-TB-Platte</small></h1>
    <div class="reiter" role="tablist">
      <button role="tab" id="t-filme" aria-selected="true">Filme</button>
      <button role="tab" id="t-serien" aria-selected="false">Serien</button>
    </div>
    <input id="q" class="suche glas" type="search" placeholder="Titel suchen …" autocomplete="off" enterkeyhint="search">
  </div>
  <div class="filter" id="filter">
    <button class="chip" id="f-platte" aria-pressed="false">💿 Nur auf der Platte</button>
    <button class="chip" id="f-kinder" aria-pressed="false">🧒 Kinder</button>
    <select class="chip" id="f-genre"><option value="">Alle Genres</option></select>
  </div>
</header>
<main>
  <div id="info"></div>
  <div id="raster"></div>
</main>
<div id="decke"></div>
<div class="blatt glas" id="blatt" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div id="tipp" class="glas" role="dialog" aria-label="Zum Home-Bildschirm hinzufügen" aria-hidden="true">
  <div class="kopf"><img src="symbole/apple-touch-icon.png" alt=""><h3>Als App auf den Home-Bildschirm?</h3></div>
  <ol id="tippschritte"></ol>
  <div class="knoepfe"><button id="tipp-spaeter" type="button">Später</button><button id="tipp-ok" class="haupt" type="button">Verstanden</button></div>
</div>
<footer><button id="leicht">Effekte reduzieren</button></footer>
<script>
(function(){
"use strict";
var DATEN="daten/", daten=null, tab="filme", nurPlatte=false, kinder=false, genre="", suche="";
var $=function(i){return document.getElementById(i)};
function speicher(k,w){try{if(w===undefined)return localStorage.getItem(k);localStorage.setItem(k,w)}catch(e){return null}}
function leicht(an){document.body.classList.toggle("leicht",an);$("leicht").textContent=an?"Effekte einschalten":"Effekte reduzieren";speicher("leicht",an?"1":"0")}
var l=speicher("leicht"); if(l==null){l=(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)?"1":"0"} leicht(l==="1");
$("leicht").onclick=function(){leicht(!document.body.classList.contains("leicht"))};

function status(x){return x.teilweise?"teil":(x.auf10tb?"ja":"nein")}
function liste(){return (daten&&daten[tab])||[]}
function gefiltert(){
  var s=suche.trim().toLowerCase();
  return liste().filter(function(x){
    if(nurPlatte&&!x.auf10tb)return false;
    if(kinder&&!x.kinder)return false;
    if(genre&&x.genres.indexOf(genre)<0)return false;
    if(s&&x.titel.toLowerCase().indexOf(s)<0)return false;
    return true});
}
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function karte(x){
  var b=el("button","karte "+status(x)); b.type="button"; b.setAttribute("aria-label",x.titel);
  var bild=el("div","bild"), im=new Image(); im.src=DATEN+"poster/"+x.poster; im.alt=""; im.loading="lazy"; im.decoding="async"; bild.appendChild(im);
  if(x.fsk!=null)bild.appendChild(el("div","fsk",x.fsk===0?"0":String(x.fsk)));
  if(x.auf10tb||x.teilweise){var p=el("div","platte"); p.appendChild(el("i")); p.appendChild(document.createTextNode(x.teilweise?"Platte teilweise":"Platte")); bild.appendChild(p)}
  b.appendChild(bild); b.appendChild(el("div","titel",x.titel)); if(x.jahr)b.appendChild(el("div","jahr",String(x.jahr)));
  b.onclick=function(){oeffnen(x)}; b.onmouseenter=b.onfocus=function(){hintergrund(x)};
  return b;
}
var hgNr=0;
function hintergrund(x){ if(document.body.classList.contains("leicht"))return; var n=++hgNr; var i=new Image(); i.onload=function(){if(n===hgNr)$("hg").style.backgroundImage="url('"+i.src+"')"}; i.src=DATEN+"poster/"+x.poster}
var geplant=0;
function zeichnen(){
  var l=gefiltert(), r=$("raster"); r.textContent="";
  var f=document.createDocumentFragment(); l.forEach(function(x){f.appendChild(karte(x))}); r.appendChild(f);
  var ges=liste().length, plat=liste().filter(function(x){return x.auf10tb}).length;
  $("info").textContent=l.length===ges?(ges+" "+(tab==="filme"?"Filme":"Serien")+", "+plat+" davon auf der 10-TB-Platte"):(l.length+" von "+ges+" Treffern");
  if(!l.length){r.appendChild(el("div","leer","Nichts gefunden."))}
  if(l[0])hintergrund(l[0]);
}
function genres(){
  var s={}; liste().forEach(function(x){x.genres.forEach(function(g){s[g]=1})});
  var sel=$("f-genre"); sel.textContent=""; var o=el("option",null,"Alle Genres"); o.value=""; sel.appendChild(o);
  Object.keys(s).sort(function(a,b){return a.localeCompare(b,"de")}).forEach(function(g){var o=el("option",null,g);o.value=g;sel.appendChild(o)});
  if(genre&&!s[genre])genre=""; sel.value=genre;
}
function oeffnen(x){
  var b=$("blatt"); b.textContent="";
  var zu=el("button","zu","✕"); zu.type="button"; zu.setAttribute("aria-label","Schließen"); zu.onclick=schliessen; b.appendChild(zu);
  var k=el("div","kopf"), im=new Image(); im.src=DATEN+"poster/"+x.poster; im.alt=""; k.appendChild(im);
  var t=el("div"); t.appendChild(el("h2",null,x.titel));
  var m=[]; if(x.jahr)m.push(x.jahr); if(x.fsk!=null)m.push("FSK "+x.fsk); if(x.staffeln)m.push(x.staffeln+(x.staffeln===1?" Staffel":" Staffeln")); if(x.folgen)m.push(x.folgen+" Folgen");
  t.appendChild(el("div","meta",m.join(" · ")));
  var tg=el("div","tags"); x.genres.forEach(function(g){tg.appendChild(el("span",null,g))}); t.appendChild(tg); k.appendChild(t); b.appendChild(k);
  var s=status(x), st=el("div","status "+s); st.appendChild(el("i")); var d=el("div");
  var kopf=s==="ja"?"Liegt auf der 10-TB-Platte":(s==="teil"?"Liegt teilweise auf der 10-TB-Platte":"Läuft ohne die 10-TB-Platte");
  var text=s==="ja"?"Zum Schauen muss die Platte eingeschaltet sein – über Heimkino geht das automatisch.":(s==="teil"?"Ein Teil der Folgen liegt auf der Platte, der Rest auf den anderen Platten.":"Immer abspielbar, auch am Apple TV – die Platte muss nicht an sein.");
  d.appendChild(el("b",null,kopf)); d.appendChild(el("span",null,text)); st.appendChild(d); b.appendChild(st);
  $("decke").classList.add("auf"); b.classList.add("auf"); b.setAttribute("aria-hidden","false"); hintergrund(x);
}
function schliessen(){$("decke").classList.remove("auf");$("blatt").classList.remove("auf");$("blatt").setAttribute("aria-hidden","true")}
$("decke").onclick=schliessen; document.addEventListener("keydown",function(e){if(e.key==="Escape")schliessen()});
function setzeTab(t){tab=t;$("t-filme").setAttribute("aria-selected",t==="filme");$("t-serien").setAttribute("aria-selected",t==="serien");genres();zeichnen();scrollTo(0,0)}
$("t-filme").onclick=function(){setzeTab("filme")}; $("t-serien").onclick=function(){setzeTab("serien")};
function chip(id,fn){var b=$(id);b.onclick=function(){var an=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",an);fn(an);zeichnen()}}
chip("f-platte",function(a){nurPlatte=a}); chip("f-kinder",function(a){kinder=a});
$("f-genre").onchange=function(){genre=this.value;zeichnen()};
var tmr; $("q").oninput=function(){var w=this.value;clearTimeout(tmr);tmr=setTimeout(function(){suche=w;zeichnen()},120)};
/* Hinweis beim ersten Besuch */
function tipp(){
  var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
  if(standalone||speicher("tipp")==="1"||/[?&]tipp=aus/.test(location.search))return;
  var ua=navigator.userAgent, ios=/iP(hone|ad|od)/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1), android=/Android/.test(ua), s;
  if(ios)s=["Unten auf <b>Teilen</b> tippen (Quadrat mit Pfeil nach oben).","<b>Zum Home-Bildschirm</b> wählen.","Oben rechts <b>Hinzufügen</b> – fertig."];
  else if(android)s=["Oben rechts das <b>Menü ⋮</b> öffnen.","<b>App installieren</b> bzw. <b>Zum Startbildschirm hinzufügen</b> wählen.","<b>Installieren</b> bestätigen."];
  else s=["Am Mac in Safari: <b>Ablage › Zum Dock hinzufügen</b>.","In Chrome/Edge: Symbol <b>App installieren</b> in der Adresszeile.","Sonst einfach ein Lesezeichen setzen."];
  $("tippschritte").innerHTML=s.map(function(x){return "<li>"+x+"</li>"}).join("");
  function zu(merken){var d=$("tipp");d.classList.remove("auf");d.setAttribute("aria-hidden","true");if(merken)speicher("tipp","1")}
  $("tipp-ok").onclick=function(){zu(true)}; $("tipp-spaeter").onclick=function(){zu(false)};
  setTimeout(function(){var d=$("tipp");d.classList.add("auf");d.setAttribute("aria-hidden","false")},1500);
}
tipp();
fetch(DATEN+"filme.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  daten=d; try{var z=new Date(d.erzeugt);$("stand").textContent="auf der 10-TB-Platte · Stand "+z.toLocaleDateString("de-DE")}catch(e){}
  genres(); zeichnen();
}).catch(function(){$("info").textContent="Die Liste konnte nicht geladen werden."});
})();
</script>
</body>
</html>
